docs_dir: docs

site_name: Swax
site_description: Swax is tool for test plan generation based on AI
site_url: https://qarium.github.io/swax/
repo_url: https://github.com/qarium/gswax
edit_uri: edit/1.0.x/docs/

theme:
  name: material
  custom_dir: docs/overrides
  logo: https://avatars.githubusercontent.com/u/262344922?s=200&v=4
  palette:
    - scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
        media: "(prefers-color-scheme: light)"
    - scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
        media: "(prefers-color-scheme: dark)"
  features:
    - navigation.tabs
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
      - Quickstart: getting-started/quickstart.md
  - Guide:
      - Commands: guide/commands.md
      - Project layout: guide/project-layout.md
      - Traceability graph: guide/traceability-graph.md
      - Impact Report: guide/impact-report.md
  - Architecture:
      - Overview: architecture/overview.md
      - Cells:
          - Reference: architecture/cells/index.md
          - cli: architecture/cells/cli.md
          - commands: architecture/cells/commands.md
          - applications: architecture/cells/applications.md
          - config: architecture/cells/config.md
          - fs: architecture/cells/fs.md
          - git: architecture/cells/git.md
          - openapi: architecture/cells/openapi.md
          - llm: architecture/cells/llm.md
          - prompts: architecture/cells/prompts.md
          - traceability: architecture/cells/traceability.md
      - Conventions: architecture/conventions.md

plugins:
  - search
