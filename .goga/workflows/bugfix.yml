prompt: |
  Answer (feedbacks, proposes, questions and etc) in Russian language.

stages:
  hotfix:
    prompt: |
      Find problem and fix it.

      Requirements:
      - Ask user about approve plan

      Constraints:
      - Don't implementation without approve from user
      - Don't research before you receive the task from user

extend:
  update-docs:
    communication: true
    after:
      - accept-result
    skills:
      - goga-tool
    prompt: |
      ARGUMENTS="mkdocs"

      Requirements:
      - Fix changes after update docs
